<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressure Sensors for EV | TE Connectivity</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-product-id="pressure-sensor">
  <header class="site-header">
    <div class="header-main">
      <a href="../index.html" class="logo-link">
        <img src="../images/te-logo.png" alt="TE Connectivity" class="logo">
      </a>
      <nav>
        <ul class="nav-main">
          <li><a href="../industries/e-mobility.html">Industries</a></li>
          <li><a href="#">Products</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="#" class="btn btn-primary">Contact Us</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <h1 class="section-title">Pressure Sensors for EV</h1>
      <p style="max-width: 800px; margin-bottom: 24px;">High-accuracy pressure sensors for battery thermal management and brake systems in electric vehicles.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-copy">© TE Connectivity. All rights reserved.</p>
    </div>
  </footer>

  <div class="chat-widget">
    <button id="chatToggle" class="chat-toggle" aria-label="Open chat">
      <span class="chat-toggle-text">Ask Me Anything</span>
      <img src="../images/te-agent-icon.png" alt="" class="chat-toggle-icon">
    </button>
    <div id="chatPanel" class="chat-panel">
      <div class="chat-header">
        <img src="../images/te-agent-icon.png" alt="" class="chat-header-icon">
        <div class="chat-header-title">
          <span class="chat-agent-name">TE.V.A.</span>
          <span class="chat-agent-subtitle">TE's Virtual Assistant</span>
        </div>
        <div class="chat-header-actions">
          <button class="chat-header-menu" aria-label="Menu">⋮</button>
          <button id="chatClose" class="chat-close" aria-label="Close chat">▾</button>
        </div>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-input-area">
        <div class="chat-input-row">
          <input type="text" id="chatInput" class="chat-input" placeholder="Type your message..." autocomplete="off">
          <button type="button" id="chatSend" class="chat-send-btn" aria-label="Send message">
            <svg class="chat-send-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="chat-footer">
        <img src="../images/powered-by-agentforce.png" alt="Powered by Agentforce from salesforce" class="chat-powered-by">
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/chat-agent.js"></script>
</body>
</html>

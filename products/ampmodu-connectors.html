<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMPMODU Connectors | TE Connectivity</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-product-id="ampmodu">
  <header class="site-header">
    <div class="header-main">
      <a href="../index.html" class="logo-link">
        <img src="../images/te-logo.png" alt="TE Connectivity" class="logo">
      </a>
      <nav>
        <ul class="nav-main">
          <li><a href="../industries/e-mobility.html">Industries</a></li>
          <li><a href="#">Products</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="#" class="btn btn-primary">Contact Us</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <h1 class="section-title">AMPMODU Connectors</h1>
      <p style="max-width: 800px; margin-bottom: 24px;">Board-to-board and wire-to-board connectors for industrial and data center applications.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-copy">© TE Connectivity. All rights reserved.</p>
    </div>
  </footer>

  <div class="chat-widget">
    <button id="chatToggle" class="chat-toggle" aria-label="Open chat">💬</button>
    <div id="chatPanel" class="chat-panel">
      <div class="chat-header">
        <h3>TE Digital Assistant</h3>
        <button id="chatClose" class="chat-close" aria-label="Close chat">&times;</button>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-input-area">
        <div class="chat-input-row">
          <input type="text" id="chatInput" class="chat-input" placeholder="Type your message..." autocomplete="off">
          <button id="chatSend" class="chat-send">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/chat-agent.js"></script>
</body>
</html>
